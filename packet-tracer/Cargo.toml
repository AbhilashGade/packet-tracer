[package]
name = "packet-tracer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aya = "0.14"
packet-tracer-common = { path = "../packet-tracer-common", features = ["user"] }

anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
# "net" is what provides `tokio::io::unix::AsyncFd`, used to wait on the ring
# buffer's epoll fd rather than spinning on it.
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[[bin]]
name = "packet-tracer"
path = "src/main.rs"
